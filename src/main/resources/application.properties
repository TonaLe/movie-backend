#**** OKHTTP *****

okhttp.connect.timeout=10
okhttp.read.timeout=30
okhttp.write.timeout=30
okhttp.max.idle.connections=5
okhttp.keep.alive.duration=5

#**** DB Access Token *****
db.client.access_token=${ACCESS_TOKEN}
db.client.api_key=${API_KEY}
db.client.host=https://api.themoviedb.org/3
db.client.discover_path=/discover/movie
db.client.search_movie_path=/search/movie

#**** Database Configuration *****
# PostgreSQL datasource configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/movie_db}

# Connection pool settings for better performance
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.acquisition-timeout=10

# Hibernate ORM configuration
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.sql-load-script=no-file

# Transaction timeout
quarkus.transaction-manager.default-transaction-timeout=30s